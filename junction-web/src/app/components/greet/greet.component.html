<div class="greet-backdrop" role="dialog" aria-modal="true" aria-labelledby="greet-title">
  <section class="greet-card">
    <div class="greet-wordmark">
      <h1 id="greet-title" class="wordmark-primary">Welcome</h1>
      <p class="wordmark-prompt">Select your Junction.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label>
        <span>Your name</span>
        <input type="text" formControlName="name" placeholder="Enter your name" autocomplete="name" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <small>Please enter your name.</small>
        }
      </label>

      <label>
        <span>City</span>
        <button type="button" class="field-button" (click)="openCityPicker()">
          {{ selectedCityName() ?? 'Add city' }}
        </button>
        @if (form.controls.name.touched && !selectedCityName()) {
          <small>Please choose a city.</small>
        }
      </label>

      <label>
        <span>Locality</span>
        <button
          type="button"
          class="field-button"
          [disabled]="!selectedCityName()"
          (click)="openLocalityPicker()"
        >
          @if (!selectedCityName()) {
            Select a city first
          } @else {
            {{ selectedLocalityName() ?? 'Add locality' }}
          }
        </button>
        @if (form.controls.name.touched && selectedCityName() && !selectedLocalityName()) {
          <small>Please choose a locality.</small>
        }
      </label>

      <button type="submit" class="submit-button">Continue</button>
    </form>
  </section>
</div>

@if (activePicker() === 'city') {
  <app-location-picker-modal
    title="Add city"
    [options]="cityPickerOptions"
    emptyMessage="No cities available."
    (picked)="onCityPicked($event)"
    (dismissed)="closePicker()"
  />
}

@if (activePicker() === 'locality') {
  <app-location-picker-modal
    title="Add locality"
    [options]="localityPickerOptions"
    [loading]="localitiesLoading"
    emptyMessage="No localities available for this city."
    (picked)="onLocalityPicked($event)"
    (dismissed)="closePicker()"
  />
}
