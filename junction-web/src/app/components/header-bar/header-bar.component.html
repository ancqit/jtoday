<header class="header-bar">
  <div class="brand">
    <span class="brand-mark">J</span>
    <div>
      <p class="brand-title">Junction</p>
      <p class="brand-subtitle">Today</p>
    </div>
  </div>

  @if (session.hasCompletedWelcome()) {
    <div class="session-controls">
      <div class="session-copy">
        <p class="welcome-name">Hello, {{ session.displayName() }}</p>
        <p class="junction-label">Your Junction · {{ session.junctionLabel() }}</p>
      </div>

      <div class="settings-anchor">
        <button
          type="button"
          class="settings-button"
          aria-label="Change Junction location"
          [attr.aria-expanded]="settingsOpen()"
          (click)="$event.stopPropagation(); toggleSettings()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8.94-2.88.98-.17a.75.75 0 0 0 .6-.87l-.97-5.7a.75.75 0 0 0-.9-.6l-.98.2-1.12-.86a.75.75 0 0 0-.9.04l-1.4 1.15-.98-.14a.75.75 0 0 0-.72.55l-.97 5.7a.75.75 0 0 0 .6.87l.98.17.14.98a.75.75 0 0 0 .87.6l5.7-.97a.75.75 0 0 0 .6-.9l-.17-.98.86-1.12a.75.75 0 0 0 .04-.9l-1.15-1.4Z"
            />
          </svg>
        </button>

        @if (settingsOpen()) {
          <section class="settings-panel" aria-label="Change Junction location">
            <p class="settings-title">Change your Junction</p>

            <form [formGroup]="form" class="settings-form" (ngSubmit)="applyJunctionChange()">
              <label>
                <span>City</span>
                <select formControlName="cityName" aria-label="City">
                  @for (city of cities; track city.id) {
                    <option [value]="city.name">{{ city.name }}</option>
                  }
                </select>
              </label>

              <label>
                <span>Locality</span>
                <select formControlName="localityName" aria-label="Locality">
                  <option value="" disabled>
                    @if (localitiesLoading) {
                      Loading localities...
                    } @else if (!form.controls.cityName.value) {
                      Select a city first
                    } @else {
                      Select a locality
                    }
                  </option>
                  @for (locality of localities; track locality.id) {
                    <option [value]="locality.name">{{ locality.name }}</option>
                  }
                </select>
              </label>

              <div class="settings-actions">
                <button type="button" class="btn-secondary" (click)="closeSettings()">Cancel</button>
                <button type="submit" class="btn-primary" [disabled]="form.invalid">Apply</button>
              </div>
            </form>
          </section>
        }
      </div>
    </div>
  }
</header>
