<div class="profile-backdrop" role="dialog" aria-modal="true" aria-label="Your profile" (click)="onDismiss()">
  <section class="profile-card" (click)="$event.stopPropagation()">
    <header class="profile-header">
      <div>
        <h2 class="profile-title wordmark-prompt">Your profile</h2>
        <p class="profile-subtitle">Add your email and phone so shops can reach you.</p>
      </div>
      <button type="button" class="profile-close" aria-label="Close" (click)="onDismiss()">×</button>
    </header>

    <form class="profile-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small>Enter a valid email address.</small>
        }
      </label>

      <label>
        <span>Phone</span>
        <input type="tel" formControlName="phoneNumber" autocomplete="tel" placeholder="+91 98765 43210" />
        @if (form.controls.phoneNumber.touched && form.controls.phoneNumber.invalid) {
          <small>Enter a valid phone number.</small>
        }
      </label>

      @if (error()) {
        <p class="profile-error">{{ error() }}</p>
      }

      <div class="profile-actions">
        <button type="button" class="btn-secondary" (click)="onDismiss()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save profile' }}
        </button>
      </div>
    </form>
  </section>
</div>
