<div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
  <section class="modal-card">
    <p class="eyebrow">Junction Today</p>
    <h1 id="welcome-title">Welcome</h1>
    <p class="subtitle">Tell us where you are so we can place you on the map.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label>
        <span>Your name</span>
        <input type="text" formControlName="name" placeholder="Enter your name" autocomplete="name" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <small>Please enter your name.</small>
        }
      </label>

      <label>
        <span>City</span>
        <select formControlName="cityId">
          <option value="" disabled>Select a city</option>
          @for (city of cities; track city.id) {
            <option [value]="city.id">{{ city.name }}</option>
          }
        </select>
        @if (form.controls.cityId.touched && form.controls.cityId.invalid) {
          <small>Please choose a city.</small>
        }
      </label>

      <label>
        <span>Locality</span>
        <select formControlName="localityId" [disabled]="!form.controls.cityId.value || localities.length === 0">
          <option value="" disabled>Select a locality</option>
          @for (locality of localities; track locality.id) {
            <option [value]="locality.id">{{ locality.name }}</option>
          }
        </select>
        @if (form.controls.localityId.touched && form.controls.localityId.invalid) {
          <small>Please choose a locality.</small>
        }
      </label>

      <button type="submit">Continue</button>
    </form>
  </section>
</div>
