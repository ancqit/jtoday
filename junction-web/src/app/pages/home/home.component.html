<div class="app-shell" [class.welcome-active]="!hasCompletedWelcome()">
  @if (hasCompletedWelcome()) {
    <div class="app-layout">
      <div class="app-chrome">
        <app-header-bar (junctionPickerRequested)="openJunctionPicker()" />

        <div class="services-actions">
          <button
            type="button"
            class="services-toggle"
            [class.active]="marketplaceOpen()"
            [attr.aria-expanded]="marketplaceOpen()"
            (click)="toggleMarketplace()"
          >
            {{ marketplaceOpen() ? 'Close services' : 'Services' }}
          </button>

          <a
            class="add-services-button"
            href="https://junction.website"
            target="_blank"
            rel="noopener noreferrer"
          >
            Add services
          </a>
        </div>
      </div>

      @if (marketplaceOpen()) {
        <div class="marketplace-slot">
          <app-marketplace-panel (closed)="closeMarketplace()" />
        </div>
      }
    </div>
  }

  <main class="map-stage">
    <app-map
      [interactive]="!hasCompletedWelcome()"
      [target]="mapTarget()"
    />
  </main>

  @if (!hasCompletedWelcome()) {
    <app-greet
      (submitted)="onGreetSubmitted($event)"
      (cityServicesSelected)="onCityServicesSelected($event)"
      (locationPreview)="onLocationPreview($event)"
    />
  }

  @if (junctionPickerOpen()) {
    <app-greet
      [reopen]="true"
      [initialProfile]="session.userProfile()"
      (submitted)="onJunctionPickerSubmitted($event)"
      (cityServicesSelected)="onJunctionPickerCityServices($event)"
      (dismissed)="closeJunctionPicker()"
      (locationPreview)="onLocationPreview($event)"
    />
  }
</div>
