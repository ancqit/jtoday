<div class="app-shell" [class.welcome-active]="!hasCompletedWelcome()">
  @if (hasCompletedWelcome()) {
    <div class="app-layout">
      <div class="app-chrome">
        <app-header-bar />

        <div class="services-actions">
          <button
            type="button"
            class="services-toggle"
            [class.active]="marketplaceOpen() && session.serviceScope() === 'locality'"
            [attr.aria-expanded]="marketplaceOpen() && session.serviceScope() === 'locality'"
            (click)="openLocalityServices()"
          >
            @if (marketplaceOpen() && session.serviceScope() === 'locality') {
              Close shops/services
            } @else {
              Shops/Services
            }
          </button>

          @if (session.userProfile(); as profile) {
            <button
              type="button"
              class="city-services-button"
              [class.active]="marketplaceOpen() && session.serviceScope() === 'city'"
              [attr.aria-expanded]="marketplaceOpen() && session.serviceScope() === 'city'"
              (click)="openCityServices()"
            >
              @if (marketplaceOpen() && session.serviceScope() === 'city') {
                Close city services
              } @else {
                City Services at {{ profile.city.name }}
              }
            </button>
          }

          <a
            class="add-services-button"
            href="https://junction.website"
            target="_blank"
            rel="noopener noreferrer"
          >
            Add services
          </a>
        </div>
      </div>

      @if (marketplaceOpen()) {
        <div class="marketplace-slot">
          <app-marketplace-panel (closed)="closeMarketplace()" />
        </div>
      }
    </div>
  }

  <main class="map-stage">
    <app-map
      [interactive]="!hasCompletedWelcome()"
      [target]="mapTarget()"
    />
  </main>

  @if (!hasCompletedWelcome()) {
    <app-greet
      (submitted)="onGreetSubmitted($event)"
      (locationPreview)="onLocationPreview($event)"
    />
  }
</div>
