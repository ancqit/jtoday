<div class="app-shell" [class.welcome-active]="!hasCompletedWelcome()">
  @if (hasCompletedWelcome()) {
    <button type="button" class="marketplace-launcher" (click)="openMarketplace()" aria-label="Browse shops">
      Shops
    </button>
    <app-header-bar />
  }

  <main class="map-stage">
    <app-map
      [interactive]="!hasCompletedWelcome()"
      [target]="mapTarget()"
    />
  </main>

  @if (!hasCompletedWelcome()) {
    <app-greet
      (submitted)="onGreetSubmitted($event)"
      (locationPreview)="onLocationPreview($event)"
    />
  }

  <app-marketplace-panel [open]="marketplaceOpen()" (closed)="closeMarketplace()" />
</div>
