<div class="app-shell" [class.welcome-active]="!hasCompletedWelcome()">
  @if (hasCompletedWelcome()) {
    <app-header-bar />
  }

  <main class="map-stage">
    <app-map
      [interactive]="!hasCompletedWelcome()"
      [target]="mapTarget()"
    />
  </main>

  @if (!hasCompletedWelcome()) {
    <app-greet
      (submitted)="onGreetSubmitted($event)"
      (locationPreview)="onLocationPreview($event)"
    />
  }
</div>
